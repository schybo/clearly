name: WiskNext
settings:
  SWIFT_VERSION: "5.9"
  SWIFT_STRICT_CONCURRENCY: complete
options:
  bundleIdPrefix: com.schybo
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true

packages:
  cmark-gfm:
    url: https://github.com/brokenhandsio/cmark-gfm.git
    from: "2.1.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.1.0"
  ClearlyCore:
    path: Packages/ClearlyCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "11.8.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "9.1.0"

targets:
  WiskNext:
    type: application
    platform: macOS
    sources:
      - path: WiskPort
        excludes:
          - "App/WiskApp.swift"
          - "App/ContentView.swift"
          - "Services/PlaudDeviceImportService.swift"
          - "Views/PlaudImportTestView.swift"
      - path: Clearly
        excludes:
          - "iOS/**"
          - "ClearlyApp.swift"
          - "SettingsView.swift"
          - "ScratchpadManager.swift"
          - "ScratchpadMenuBar.swift"
          - "ScratchpadShellView.swift"
          - "ScratchpadHistoryPicker.swift"
      - path: Shared/Resources/Firebase/GoogleService-Info-Mac.plist
        buildPhase: resources
      - path: Shared/Resources/mermaid.min.js
        buildPhase: resources
      - path: Shared/Resources/svg-pan-zoom.min.js
        buildPhase: resources
      - path: Shared/Resources/katex.min.js
        buildPhase: resources
      - path: Shared/Resources/katex.min.css
        buildPhase: resources
      - path: Shared/Resources/fonts
        buildPhase: resources
        type: folder
      - path: Shared/Resources/highlight.min.js
        buildPhase: resources
      - path: Shared/Resources/highlight-theme.css
        buildPhase: resources
      - path: Shared/Resources/demo.md
        buildPhase: resources
      - path: Shared/Resources/getting-started.md
        buildPhase: resources
    dependencies:
      - package: ClearlyCore
      - package: cmark-gfm
        product: cmark
      - package: KeyboardShortcuts
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: WiskNextQuickLook
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext
        PRODUCT_NAME: WiskNext
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Clearly/Clearly.entitlements
        INFOPLIST_FILE: Clearly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 8FV28U6FF4
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.dev
          PRODUCT_NAME: "WiskNext Dev"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

  WiskNext-iOS:
    type: application
    platform: iOS
    sources:
      - path: WiskPort
        excludes:
          - "MacViews/**"
          - "MacApp/**"
          - "Services/PlaudDeviceImportService.swift"
          - "Views/PlaudImportTestView.swift"
      - path: Clearly/iOS
        excludes:
          - "PreviewExtension/**"
          - "ThumbnailExtension/**"
          - "ClearlyApp_iOS.swift"
      - path: Clearly/MarkdownDocument.swift
      - path: Clearly/AppIcon.icon
      - path: Shared/Resources/Firebase/GoogleService-Info-Dev.plist
        buildPhase: resources
      - path: Shared/Resources/mermaid.min.js
        buildPhase: resources
      - path: Shared/Resources/svg-pan-zoom.min.js
        buildPhase: resources
      - path: Shared/Resources/katex.min.js
        buildPhase: resources
      - path: Shared/Resources/katex.min.css
        buildPhase: resources
      - path: Shared/Resources/fonts
        buildPhase: resources
        type: folder
      - path: Shared/Resources/highlight.min.js
        buildPhase: resources
      - path: Shared/Resources/highlight-theme.css
        buildPhase: resources
    dependencies:
      - package: ClearlyCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: WiskNextPreview-iOS
        embed: true
      - target: WiskNextThumbnail-iOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext
        PRODUCT_NAME: WiskNext
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Clearly/iOS/Clearly-iOS.entitlements
        INFOPLIST_FILE: Clearly/iOS/Info-iOS.plist
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: 8FV28U6FF4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iOS releases independently from Mac — see CLAUDE.md "Versioning"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.dev
          PRODUCT_NAME: "WiskNext Dev"
          CODE_SIGN_STYLE: Automatic
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG DEV_BUILD"
        Release:
          CODE_SIGN_STYLE: Automatic

  WiskNextQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: ClearlyQuickLook
      - path: Shared/Resources/mermaid.min.js
        buildPhase: resources
      - path: Shared/Resources/svg-pan-zoom.min.js
        buildPhase: resources
      - path: Shared/Resources/katex.min.js
        buildPhase: resources
      - path: Shared/Resources/katex.min.css
        buildPhase: resources
      - path: Shared/Resources/fonts
        buildPhase: resources
        type: folder
      - path: Shared/Resources/highlight.min.js
        buildPhase: resources
      - path: Shared/Resources/highlight-theme.css
        buildPhase: resources
    dependencies:
      - package: ClearlyCore
      - package: cmark-gfm
        product: cmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.quicklook
        PRODUCT_NAME: WiskNextQuickLook
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ClearlyQuickLook/ClearlyQuickLook.entitlements
        INFOPLIST_FILE: ClearlyQuickLook/Info.plist
        DEVELOPMENT_TEAM: 8FV28U6FF4
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.dev.quicklook
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

  WiskNextPreview-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Clearly/iOS/PreviewExtension
      - path: Shared/Resources/mermaid.min.js
        buildPhase: resources
      - path: Shared/Resources/svg-pan-zoom.min.js
        buildPhase: resources
      - path: Shared/Resources/katex.min.js
        buildPhase: resources
      - path: Shared/Resources/katex.min.css
        buildPhase: resources
      - path: Shared/Resources/fonts
        buildPhase: resources
        type: folder
      - path: Shared/Resources/highlight.min.js
        buildPhase: resources
      - path: Shared/Resources/highlight-theme.css
        buildPhase: resources
    dependencies:
      - package: ClearlyCore
      - package: cmark-gfm
        product: cmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.preview
        PRODUCT_NAME: WiskNextPreview
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Clearly/iOS/PreviewExtension/ClearlyPreview.entitlements
        INFOPLIST_FILE: Clearly/iOS/PreviewExtension/Info.plist
        DEVELOPMENT_TEAM: 8FV28U6FF4
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.dev.preview
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

  WiskNextThumbnail-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Clearly/iOS/ThumbnailExtension
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.thumbnail
        PRODUCT_NAME: WiskNextThumbnail
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Clearly/iOS/ThumbnailExtension/ClearlyThumbnail.entitlements
        INFOPLIST_FILE: Clearly/iOS/ThumbnailExtension/Info.plist
        DEVELOPMENT_TEAM: 8FV28U6FF4
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.dev.thumbnail
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

  WiskNextUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WiskPortUITests
        name: WiskNextUITests
    dependencies:
      - target: WiskNext-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.uitests
        PRODUCT_NAME: WiskNextUITests
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 8FV28U6FF4
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.schybo.wisknext.dev.uitests
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

schemes:
  WiskNext:
    build:
      targets:
        WiskNext: all
    run:
      config: Debug
  WiskNext-iOS:
    build:
      targets:
        WiskNext-iOS: all
        WiskNextUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WiskNextUITests
